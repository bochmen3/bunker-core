<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KONRE v7.0 // STABLE</title>
    <!-- Librerías con carga garantizada -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.321.0"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');
        
        :root { --konre-orange: #ff4500; --konre-black: #000000; }
        
        body { 
            background-color: var(--konre-black); 
            color: var(--konre-orange); 
            font-family: 'JetBrains+Mono', monospace;
            margin: 0; padding: 0; overflow: hidden;
            height: 100vh;
        }

        /* Prevenir pantalla negra en carga */
        #root { min-height: 100vh; display: flex; flex-direction: column; }

        .hide-scroll::-webkit-scrollbar { display: none; }
        
        .msg-in { animation: slideUp 0.2s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .v-bar { width: 3px; background: var(--konre-orange); animation: wave 1s infinite ease-in-out; }
        @keyframes wave { 0%, 100% { height: 4px; } 50% { height: 16px; } }
        
        .termux-led { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    </style>
</head>
<body>
    <div id="root">
        <!-- Loader inicial por si falla el JS -->
        <div style="display:flex; height:100vh; align-items:center; justify-content:center; flex-direction:column; gap:20px;">
            <div style="font-weight:bold; letter-spacing:4px; animate:pulse 2s infinite">INICIALIZANDO KONRE...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const App = () => {
            const [isAuth, setIsAuth] = useState(false);
            const [view, setView] = useState('chat');
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [isListening, setIsListening] = useState(false);
            const [termuxUrl, setTermuxUrl] = useState(localStorage.getItem('k_t_url') || 'http://192.168.1.72:8080');
            const [apiKey, setApiKey] = useState(localStorage.getItem('k_api') || '');

            const scrollRef = useRef(null);
            const recognition = useRef(null);

            // Iconos de Lucide cargados de forma segura
            const Icons = useMemo(() => ({
                Send: () => <i data-lucide="send"></i>,
                Mic: () => <i data-lucide="mic"></i>,
                MicOff: () => <i data-lucide="mic-off"></i>,
                Settings: () => <i data-lucide="settings"></i>,
                Terminal: () => <i data-lucide="terminal"></i>,
                Music: () => <i data-lucide="music"></i>,
                X: () => <i data-lucide="x"></i>,
                Cpu: () => <i data-lucide="cpu"></i>
            }), []);

            useEffect(() => {
                // Forzar renderizado de iconos después de que React monte el componente
                lucide.createIcons();
            }, [view, isAuth, messages, isListening]);

            useEffect(() => {
                const h = localStorage.getItem('k_history');
                if (h) setMessages(JSON.parse(h));
                else setMessages([{ id: 1, text: "SISTEMA KONRE v7.0 ONLINE.\nEnlace Termux: 192.168.1.72\nEsperando órdenes, Dilan.", type: "ai" }]);

                // Configurar reconocimiento de voz de forma segura
                try {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (SpeechRecognition) {
                        recognition.current = new SpeechRecognition();
                        recognition.current.lang = 'es-MX';
                        recognition.current.onresult = (e) => {
                            const t = e.results[0][0].transcript;
                            setInput(t);
                            setIsListening(false);
                            handleSend(t);
                        };
                        recognition.current.onerror = () => setIsListening(false);
                        recognition.current.onend = () => setIsListening(false);
                    }
                } catch(e) { console.error("Speech no soportado"); }
            }, []);

            useEffect(() => {
                localStorage.setItem('k_history', JSON.stringify(messages));
                scrollRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const speak = (txt) => {
                if (!txt) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(txt);
                u.lang = 'es-MX';
                u.pitch = 0.7;
                window.speechSynthesis.speak(u);
            };

            const execTermux = async (cmd) => {
                try {
                    const res = await fetch(`${termuxUrl}/exec?cmd=${encodeURIComponent(cmd)}`, { mode: 'cors' });
                    return await res.text();
                } catch (e) {
                    return "ERROR: No hay respuesta del servidor Termux.";
                }
            };

            const handleSend = async (override) => {
                const val = (override || input).trim();
                if (!val) return;

                if (!override) setInput('');
                setMessages(prev => [...prev, { id: Date.now(), text: val, type: 'user' }]);
                setLoading(true);

                // LÓGICA TERMUX DIRECTA
                if (val.startsWith(">")) {
                    const out = await execTermux(val.substring(1));
                    setMessages(prev => [...prev, { id: Date.now(), text: `[TERMUX]: ${out}`, type: 'ai' }]);
                    setLoading(false);
                    return;
                }

                // LÓGICA IA
                try {
                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: val }] }],
                            systemInstruction: { parts: [{ text: "Eres KONRE, sistema rudo del búnker de Dilan. Tu hija es América. Responde técnico." }] }
                        })
                    });
                    const data = await res.json();
                    const msg = data.candidates?.[0]?.content?.parts?.[0]?.text || "Sin respuesta.";
                    setMessages(prev => [...prev, { id: Date.now(), text: msg, type: 'ai' }]);
                    speak(msg);
                } catch (e) {
                    setMessages(prev => [...prev, { id: Date.now(), text: "Error de conexión con el núcleo.", type: 'ai' }]);
                } finally {
                    setLoading(false);
                }
            };

            if (!isAuth) return (
                <div className="flex-1 flex flex-col items-center justify-center p-10">
                    <div className="mb-8 text-orange-600 animate-pulse"><Icons.Cpu /></div>
                    <h1 className="text-3xl font-black italic mb-10 tracking-widest">KONRE v7.0</h1>
                    <input 
                        type="password" 
                        placeholder="ACCESO BÜNKER"
                        className="w-full max-w-xs bg-zinc-900 border border-zinc-800 p-4 rounded-2xl text-center font-bold text-orange-500 focus:border-orange-600 outline-none"
                        onKeyDown={e => e.key === 'Enter' && e.target.value.toLowerCase() === 'peniche' && setIsAuth(true)}
                    />
                </div>
            );

            return (
                <div className="flex-1 flex flex-col h-screen">
                    <header className="p-4 pt-12 border-b border-zinc-900 flex justify-between items-center bg-black/50">
                        <div className="flex items-center gap-3">
                            <div className="termux-led"></div>
                            <span className="text-[10px] font-bold tracking-widest">TERMUX: 192.168.1.72</span>
                        </div>
                        <button onClick={() => setView(view === 'chat' ? 'cfg' : 'chat')} className="p-2 bg-zinc-900 rounded-xl">
                            <Icons.Settings />
                        </button>
                    </header>

                    <main className="flex-1 overflow-hidden relative">
                        {view === 'chat' ? (
                            <div className="h-full flex flex-col">
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 hide-scroll">
                                    {messages.map(m => (
                                        <div key={m.id} className={`flex ${m.type === 'user' ? 'justify-end' : 'justify-start'} msg-in`}>
                                            <div className={`p-4 rounded-2xl max-w-[90%] text-sm border font-mono ${m.type === 'user' ? 'bg-orange-600 text-black border-orange-400 font-bold' : 'bg-zinc-950 border-zinc-900 text-zinc-100'}`}>
                                                {m.text}
                                            </div>
                                        </div>
                                    ))}
                                    {loading && <div className="text-[10px] animate-pulse">PROCESANDO...</div>}
                                    <div ref={scrollRef} />
                                </div>

                                <div className="p-4 bg-black border-t border-zinc-900 space-y-4">
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={() => { setIsListening(true); recognition.current?.start(); }}
                                            className={`p-4 rounded-2xl border ${isListening ? 'bg-red-600 border-red-400' : 'bg-zinc-900 border-zinc-800 text-zinc-400'}`}
                                        >
                                            {isListening ? <Icons.Mic /> : <Icons.MicOff />}
                                        </button>
                                        
                                        <input 
                                            className="flex-1 bg-zinc-900 border border-zinc-800 rounded-2xl px-4 text-sm text-white font-mono outline-none"
                                            placeholder=">comando o mensaje..."
                                            value={input}
                                            onChange={e => setInput(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && handleSend()}
                                        />
                                        
                                        <button onClick={() => handleSend()} className="p-4 bg-orange-600 text-black rounded-2xl font-bold">
                                            <Icons.Send />
                                        </button>
                                    </div>
                                    <div className="flex justify-between px-2 text-[8px] font-bold opacity-30 tracking-[0.3em] uppercase">
                                        <span>Dilan & América Bunker</span>
                                        <span>v7.0 Stabilized</span>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="p-8 space-y-8 h-full overflow-y-auto">
                                <h2 className="text-xs font-black uppercase tracking-widest border-b border-zinc-900 pb-2">Sistema Central</h2>
                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-[10px] opacity-40 font-bold">TERMUX URL</label>
                                        <input 
                                            type="text"
                                            className="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-2xl text-xs text-white"
                                            value={termuxUrl}
                                            onChange={e => { setTermuxUrl(e.target.value); localStorage.setItem('k_t_url', e.target.value); }}
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] opacity-40 font-bold">GEMINI API KEY</label>
                                        <input 
                                            type="password"
                                            className="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-2xl text-xs text-white"
                                            value={apiKey}
                                            onChange={e => { setApiKey(e.target.value); localStorage.setItem('k_api', e.target.value); }}
                                        />
                                    </div>
                                </div>
                                <button onClick={() => window.location.reload()} className="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-2xl text-[10px] font-bold">REINICIAR NÚCLEO</button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
