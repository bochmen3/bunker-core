<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KONRE // BÜNKER OS</title>
    <!-- Cargando librerías para ejecución en el móvil -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');
        body { 
            font-family: 'JetBrains+Mono', monospace; 
            background-color: #020617; 
            margin: 0; 
            color: #f8fafc;
            overflow: hidden;
        }
        /* Efecto de líneas de monitor antiguo */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02));
            z-index: 99;
            background-size: 100% 3px, 3px 100%;
            pointer-events: none;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="scanlines"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isAuth, setIsAuth] = useState(false);
            const [passKey, setPassKey] = useState("");
            const [view, setView] = useState("chat");
            const [messages, setMessages] = useState([]);
            const [userInput, setUserInput] = useState("");
            const [isSearching, setIsSearching] = useState(false);
            const [records, setRecords] = useState(() => {
                try {
                    const saved = localStorage.getItem('bunker_vault_v2');
                    return saved ? JSON.parse(saved) : [];
                } catch(e) { return []; }
            });

            const chatEndRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('bunker_vault_v2', JSON.stringify(records));
            }, [records]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, isSearching]);

            const validateAuth = () => {
                // Clave maestra definida por el usuario
                if (passKey.toLowerCase() === "peniche") {
                    setIsAuth(true);
                    addMessage("SISTEMA", "Iniciando Protocolo KONRE v2.5...", "system");
                    setTimeout(() => {
                        addMessage("KONRE", "Acceso nivel Élite verificado. El Bünker está operativo, Copetes.", "ai");
                    }, 800);
                } else {
                    setPassKey("");
                }
            };

            const addMessage = (sender, text, type = "user", sources = []) => {
                setMessages(prev => [...prev, { id: Date.now(), sender, text, type, sources }]);
            };

            const handleSend = async () => {
                if (!userInput.trim()) return;
                const query = userInput;
                addMessage("COPETES", query, "user");
                setUserInput("");
                setIsSearching(true);

                try {
                    const apiKey = ""; // La clave se inyecta en tiempo de ejecución
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Actúa como KONRE, la IA técnica del búnker de Copetes. Responde con precisión técnica a: ${query}` }] }],
                            tools: [{ "google_search": {} }]
                        })
                    });

                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error en el enlace neuronal.";
                    const aiSources = data.candidates?.[0]?.groundingMetadata?.groundingAttributions?.map(a => ({
                        title: a.web?.title,
                        uri: a.web?.uri
                    })) || [];

                    addMessage("KONRE", aiText, "ai", aiSources);
                } catch (error) {
                    addMessage("SISTEMA", "Fallo de conexión. El núcleo no responde.", "system");
                } finally {
                    setIsSearching(false);
                }
            };

            if (!isAuth) {
                return (
                    <div className="h-screen w-full flex items-center justify-center bg-slate-950 p-6">
                        <div className="w-full max-w-sm space-y-8">
                            <div className="text-center">
                                <h1 className="text-4xl font-black italic tracking-tighter text-sky-500 mb-2">BÜNKER</h1>
                                <p className="text-[9px] text-sky-800 tracking-[0.4em] font-bold uppercase">Security Interface</p>
                            </div>
                            <div className="bg-slate-900/40 border border-sky-900/30 p-8 rounded-[2rem] backdrop-blur-md shadow-2xl">
                                <input 
                                    type="password"
                                    value={passKey}
                                    onChange={(e) => setPassKey(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && validateAuth()}
                                    placeholder="LLAVE MAESTRA"
                                    className="w-full bg-black border border-sky-900/50 p-4 rounded-2xl text-center text-sky-400 focus:outline-none focus:border-sky-500 tracking-[0.5em] text-xs transition-all"
                                />
                                <button 
                                    onClick={validateAuth}
                                    className="w-full mt-4 py-4 bg-sky-600 rounded-2xl font-black text-[10px] tracking-[0.2em] text-white hover:bg-sky-500 active:scale-95 transition-all shadow-lg shadow-sky-900/20"
                                >
                                    AUTENTICAR
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col bg-slate-950">
                    <header className="p-4 border-b border-sky-900/20 flex justify-between items-center bg-black/40 backdrop-blur-sm">
                        <div className="flex flex-col">
                            <span className="text-[12px] font-black text-sky-500 tracking-widest italic">KONRE // OS</span>
                            <span className="text-[7px] text-sky-800 font-bold uppercase">Encrypted Connection</span>
                        </div>
                        <div className="flex bg-slate-900/80 p-1 rounded-xl border border-white/5">
                            <button onClick={() => setView("chat")} className={`px-4 py-2 text-[9px] font-bold rounded-lg transition-all ${view === 'chat' ? 'bg-sky-600 text-white' : 'text-slate-500'}`}>CHAT</button>
                            <button onClick={() => setView("vault")} className={`px-4 py-2 text-[9px] font-bold rounded-lg transition-all ${view === 'vault' ? 'bg-sky-600 text-white' : 'text-slate-500'}`}>BÜNKER</button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden flex flex-col">
                        {view === 'chat' ? (
                            <>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                                    {messages.map(msg => (
                                        <div key={msg.id} className={`flex flex-col ${msg.type === 'user' ? 'items-end' : 'items-start'}`}>
                                            <span className="text-[7px] text-slate-600 uppercase mb-1 font-bold px-2">{msg.sender}</span>
                                            <div className={`p-4 rounded-2xl text-[11px] max-w-[90%] leading-relaxed ${
                                                msg.type === 'user' 
                                                ? 'bg-sky-900/20 text-sky-100 border border-sky-800/30 rounded-tr-none' 
                                                : msg.type === 'system'
                                                ? 'bg-red-900/10 text-red-400 border border-red-900/20 italic'
                                                : 'bg-slate-900 text-slate-200 border border-slate-800 rounded-tl-none'
                                            }`}>
                                                {msg.text}
                                                {msg.sources?.length > 0 && (
                                                    <div className="mt-3 flex flex-wrap gap-1 border-t border-slate-800 pt-2">
                                                        {msg.sources.map((s, i) => (
                                                            <a key={i} href={s.uri} target="_blank" className="text-[7px] bg-sky-950 text-sky-400 px-2 py-0.5 rounded border border-sky-900/20">
                                                                VER FUENTE
                                                            </a>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                    {isSearching && (
                                        <div className="flex items-center gap-2 text-sky-600 p-4 text-[9px] font-bold italic animate-pulse">
                                            <span>ESCANEANDO REDES DE INGENIERÍA...</span>
                                        </div>
                                    )}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="p-4 border-t border-sky-900/10 bg-black/30">
                                    <div className="flex gap-2">
                                        <input 
                                            value={userInput}
                                            onChange={(e) => setUserInput(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                            className="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl px-5 py-4 text-xs focus:outline-none focus:border-sky-800 text-white"
                                            placeholder="Consulta técnica..."
                                        />
                                        <button onClick={handleSend} className="p-4 bg-sky-600 rounded-2xl text-white shadow-lg shadow-sky-900/40">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                                        </button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="p-6 overflow-y-auto custom-scrollbar flex-1">
                                <div className="flex justify-between items-center mb-8">
                                    <h3 className="text-[10px] font-black text-sky-500 uppercase tracking-[0.3em]">Hardware & Bongs Database</h3>
                                    <button onClick={() => {
                                        const title = prompt("NOMBRE:");
                                        const specs = prompt("SPECS:");
                                        if (title && specs) setRecords([...records, { id: Date.now(), title, specs, date: new Date().toLocaleDateString() }]);
                                    }} className="bg-sky-600 px-5 py-2 rounded-xl text-[9px] font-black text-white">NUEVO</button>
                                </div>
                                <div className="grid grid-cols-1 gap-4">
                                    {records.map(record => (
                                        <div key={record.id} className="p-6 bg-slate-900/60 border border-slate-800 rounded-3xl relative overflow-hidden group">
                                            <div className="absolute top-0 left-0 w-1.5 h-full bg-sky-600"></div>
                                            <div className="flex justify-between items-center mb-4">
                                                <span className="text-[8px] text-slate-500 font-bold">REGISTRO: {record.date}</span>
                                                <button onClick={() => setRecords(records.filter(r => r.id !== record.id))} className="text-slate-700 hover:text-red-500">
                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                </button>
                                            </div>
                                            <h4 className="text-[12px] font-black uppercase text-white mb-2">{record.title}</h4>
                                            <p className="text-[10px] text-slate-400 leading-relaxed font-light">{record.specs}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </main>
                    <footer className="px-5 py-3 bg-black flex justify-between items-center border-t border-sky-900/10">
                         <div className="flex gap-4">
                            <span className="text-[7px] text-sky-900 font-bold uppercase tracking-tighter">Bunker Connection: Stable</span>
                         </div>
                         <span className="text-[7px] text-sky-900 font-bold uppercase tracking-widest">v2.5 // Copetes Edition</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
