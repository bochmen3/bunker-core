<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KONRE BLACK</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        body { 
            background-color: #000000; 
            color: #ff4500; 
            font-family: 'JetBrains+Mono', monospace;
            margin: 0; padding: 0; overflow: hidden;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        input:focus { outline: none; border-color: #ff4500 !important; }
        .msg-anim { animation: fadeInUp 0.2s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isAuth, setIsAuth] = useState(false);
            const [view, setView] = useState("chat");
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState("");
            const [isTyping, setIsTyping] = useState(false);
            const chatEndRef = useRef(null);

            // Cargar datos al inicio
            useEffect(() => {
                const history = localStorage.getItem('konre_history');
                if (history) setMessages(JSON.parse(history));
                else setMessages([{ id: 1, text: "KONRE v4.6 ONLINE. Búnker de Dilan protegido.", type: "ai" }]);
            }, []);

            // Auto-scroll
            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
                localStorage.setItem('konre_history', JSON.stringify(messages));
            }, [messages]);

            const sendMessage = async () => {
                if (!input.trim()) return;
                const userMsg = input;
                setInput("");
                setMessages(prev => [...prev, { id: Date.now(), text: userMsg, type: "user" }]);
                
                // Soporte Termux (Prefijo >)
                if (userMsg.startsWith(">")) {
                    const termuxUrl = localStorage.getItem('termux_url');
                    if (!termuxUrl) {
                        setMessages(prev => [...prev, { id: Date.now(), text: "Configura la URL de Termux en Ajustes.", type: "ai" }]);
                        return;
                    }
                    try {
                        await fetch(`${termuxUrl}/exec?cmd=${encodeURIComponent(userMsg.substring(1))}`, { mode: 'no-cors' });
                        setMessages(prev => [...prev, { id: Date.now(), text: "Comando enviado a Termux.", type: "ai" }]);
                    } catch (e) {
                        setMessages(prev => [...prev, { id: Date.now(), text: "Error de conexión con Termux.", type: "ai" }]);
                    }
                    return;
                }

                setIsTyping(true);
                try {
                    const apiKey = localStorage.getItem('gemini_key');
                    if (!apiKey) {
                        setMessages(prev => [...prev, { id: Date.now(), text: "⚠️ ERROR: Falta API KEY en Ajustes.", type: "ai" }]);
                        setIsTyping(false);
                        return;
                    }

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ contents: [{ parts: [{ text: userMsg }] }] })
                    });
                    const data = await res.json();
                    const responseText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No hay respuesta del núcleo.";
                    setMessages(prev => [...prev, { id: Date.now(), text: responseText, type: "ai" }]);
                } catch (e) {
                    setMessages(prev => [...prev, { id: Date.now(), text: "Fallo de red. Revisa tu conexión.", type: "ai" }]);
                } finally {
                    setIsTyping(false);
                }
            };

            if (!isAuth) return (
                <div className="h-screen flex items-center justify-center bg-black">
                    <div className="text-center space-y-4">
                        <h1 className="text-3xl font-bold tracking-tighter italic">KONRE BLACK</h1>
                        <input 
                            type="password" 
                            placeholder="LLAVE"
                            className="bg-black border border-zinc-800 p-3 rounded-lg text-center text-orange-600 w-64"
                            onKeyDown={e => e.key === 'Enter' && e.target.value.toLowerCase() === 'peniche' && setIsAuth(true)}
                        />
                    </div>
                </div>
            );

            return (
                <div className="h-screen flex flex-col bg-black">
                    <header className="p-4 pt-12 border-b border-zinc-900 flex justify-between items-center">
                        <span className="font-bold text-xs">KONRE // DILAN</span>
                        <button onClick={() => setView(view === "chat" ? "config" : "chat")} className="text-[10px] border border-zinc-800 px-2 py-1 rounded">
                            {view === "chat" ? "AJUSTES" : "VOLVER"}
                        </button>
                    </header>

                    <main className="flex-1 overflow-hidden">
                        {view === "chat" ? (
                            <div className="h-full flex flex-col p-4">
                                <div className="flex-1 overflow-y-auto space-y-4 no-scrollbar">
                                    {messages.map(m => (
                                        <div key={m.id} className={`flex ${m.type === 'user' ? 'justify-end' : 'justify-start'} msg-anim`}>
                                            <div className={`p-3 rounded-xl max-w-[85%] text-sm border ${m.type === 'user' ? 'bg-orange-600 text-black border-orange-500 font-bold' : 'bg-zinc-900 border-zinc-800 text-white'}`}>
                                                {m.text}
                                            </div>
                                        </div>
                                    ))}
                                    {isTyping && <div className="text-[10px] animate-pulse">KONRE procesando...</div>}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="mt-4 flex gap-2">
                                    <input 
                                        className="flex-1 bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-3 text-sm text-white"
                                        placeholder="Comando..."
                                        value={input}
                                        onChange={e => setInput(e.target.value)}
                                        onKeyDown={e => e.key === 'Enter' && sendMessage()}
                                    />
                                    <button onClick={sendMessage} className="bg-orange-600 text-black px-4 rounded-lg font-bold">></button>
                                </div>
                            </div>
                        ) : (
                            <div className="p-6 space-y-6">
                                <h2 className="text-sm font-bold">CONFIGURACIÓN</h2>
                                <div className="space-y-2">
                                    <label className="text-[10px] block opacity-50">GEMINI API KEY</label>
                                    <input 
                                        type="password"
                                        className="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-lg text-xs"
                                        onChange={e => localStorage.setItem('gemini_key', e.target.value)}
                                        placeholder="AIza..."
                                    />
                                </div>
                                <div className="space-y-2">
                                    <label className="text-[10px] block opacity-50">TERMUX URL</label>
                                    <input 
                                        className="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-lg text-xs"
                                        onChange={e => localStorage.setItem('termux_url', e.target.value)}
                                        placeholder="http://127.0.0.1:8080"
                                    />
                                </div>
                                <button 
                                    onClick={() => {localStorage.clear(); window.location.reload();}}
                                    className="text-[10px] text-red-500 border border-red-900/30 px-4 py-2 rounded"
                                >
                                    PURGAR SISTEMA (Reset)
                                </button>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
