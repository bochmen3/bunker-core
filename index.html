<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KONRE v8.0 APK</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');
        
        :root { --main-orange: #ff4500; --bg-black: #080808; }
        
        body { 
            background-color: var(--bg-black); 
            color: var(--main-orange); 
            font-family: 'JetBrains+Mono', monospace;
            margin: 0; padding: 0; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .bunker-grid {
            background-image: radial-gradient(circle at 2px 2px, #1a1a1a 1px, transparent 0);
            background-size: 24px 24px;
        }

        .glow-text { text-shadow: 0 0 10px rgba(255, 69, 0, 0.5); }
        .glass-panel { background: rgba(15, 15, 15, 0.8); backdrop-filter: blur(10px); }
        
        @keyframes pulse-border {
            0% { border-color: #333; }
            50% { border-color: var(--main-orange); }
            100% { border-color: #333; }
        }
        .active-ring { animation: pulse-border 2s infinite; }
    </style>
</head>
<body class="bunker-grid">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { Shield, Settings, Send, Zap, Battery, Activity, Cpu, Bell, Info } = lucide;

        const App = () => {
            const [isAuth, setIsAuth] = useState(false);
            const [view, setView] = useState('chat');
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [termuxUrl, setTermuxUrl] = useState(localStorage.getItem('konre_ip') || 'http://192.168.1.72:8080');
            const [apiKey, setApiKey] = useState(localStorage.getItem('konre_key') || '');

            const scrollRef = useRef(null);

            useEffect(() => {
                const history = localStorage.getItem('konre_v8_history');
                if (history) setMessages(JSON.parse(history));
                else {
                    setMessages([{ 
                        id: Date.now(), 
                        text: "NÚCLEO KONRE v8.0 APK INICIALIZADO.\n\nEstatus: Enlace Termux detectado.\nUsuario: DILAN PENICHE.\nObjetivo: Seguridad del búnker y cuidado de América.", 
                        type: 'ai' 
                    }]);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('konre_v8_history', JSON.stringify(messages));
                scrollRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const callBridge = async (command) => {
                try {
                    const response = await fetch(`${termuxUrl}/exec?cmd=${encodeURIComponent(command)}`, {
                        method: 'GET',
                        mode: 'cors',
                        cache: 'no-cache'
                    });
                    const result = await response.text();
                    setMessages(prev => [...prev, { id: Date.now(), text: `[SISTEMA]: ${result}`, type: 'ai' }]);
                } catch (error) {
                    setMessages(prev => [...prev, { id: Date.now(), text: "ERROR CRÍTICO: El puente de Termux no responde. Verifica que bridge.py esté corriendo.", type: 'ai' }]);
                }
            };

            const handleAction = async (msgOverride = null) => {
                const text = (msgOverride || input).trim();
                if (!text) return;
                if (!msgOverride) setInput('');

                setMessages(prev => [...prev, { id: Date.now(), text: text, type: 'user' }]);
                setLoading(true);

                if (text.startsWith(">")) {
                    await callBridge(text.substring(1));
                    setLoading(false);
                    return;
                }

                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: text }] }],
                            systemInstruction: { parts: [{ text: "Eres KONRE, la IA del búnker de Dilan. América es su hija. Eres rudo, protector y altamente técnico. Responde de forma concisa." }] }
                        })
                    });
                    const data = await response.json();
                    const aiResponse = data.candidates?.[0]?.content?.parts?.[0]?.text || "Núcleo sin datos.";
                    setMessages(prev => [...prev, { id: Date.now(), text: aiResponse, type: 'ai' }]);
                } catch (e) {
                    setMessages(prev => [...prev, { id: Date.now(), text: "Fallo de conexión con el satélite Gemini.", type: 'ai' }]);
                } finally {
                    setLoading(false);
                }
            };

            if (!isAuth) return (
                <div className="h-screen flex flex-col items-center justify-center p-12">
                    <div className="p-6 rounded-full border-2 border-orange-600 mb-8 animate-pulse shadow-[0_0_40px_rgba(255,69,0,0.3)]">
                        <Shield size={48} />
                    </div>
                    <h1 className="text-2xl font-black mb-10 glow-text tracking-[0.2em]">KONRE v8.0</h1>
                    <input 
                        type="password" 
                        placeholder="ACCESO AL BÜNKER"
                        className="w-full bg-zinc-900 border border-zinc-800 p-5 rounded-2xl text-center font-bold text-orange-500 placeholder-zinc-700 outline-none active-ring"
                        onKeyDown={e => e.key === 'Enter' && e.target.value.toLowerCase() === 'peniche' && setIsAuth(true)}
                    />
                </div>
            );

            return (
                <div className="h-screen flex flex-col">
                    <header className="p-4 pt-12 glass-panel border-b border-zinc-900 flex justify-between items-center">
                        <div className="flex items-center gap-3">
                            <Cpu size={18} className="animate-spin-slow" />
                            <div className="flex flex-col">
                                <span className="text-[10px] font-black tracking-widest leading-none">KONRE // MASTER</span>
                                <span className="text-[8px] opacity-40 font-bold uppercase mt-1">Status: Enlazado</span>
                            </div>
                        </div>
                        <button onClick={() => setView(view === 'chat' ? 'cfg' : 'chat')} className="p-2 bg-zinc-900 rounded-xl active:scale-90 transition-transform">
                            <Settings size={20} />
                        </button>
                    </header>

                    <main className="flex-1 overflow-hidden relative flex flex-col">
                        {view === 'chat' ? (
                            <>
                                <div className="p-3 flex gap-2 overflow-x-auto hide-scroll border-b border-zinc-900 bg-black/40">
                                    <button onClick={() => callBridge("torch on")} className="flex-shrink-0 bg-zinc-900 px-4 py-2 rounded-xl text-[10px] font-bold border border-zinc-800 flex items-center gap-2 active:bg-orange-600 active:text-black">
                                        <Zap size={12}/> FLASH
                                    </button>
                                    <button onClick={() => callBridge("battery")} className="flex-shrink-0 bg-zinc-900 px-4 py-2 rounded-xl text-[10px] font-bold border border-zinc-800 flex items-center gap-2 active:bg-orange-600 active:text-black">
                                        <Battery size={12}/> ENERGÍA
                                    </button>
                                    <button onClick={() => callBridge("vibrate")} className="flex-shrink-0 bg-zinc-900 px-4 py-2 rounded-xl text-[10px] font-bold border border-zinc-800 flex items-center gap-2 active:bg-orange-600 active:text-black">
                                        <Activity size={12}/> VIBRAR
                                    </button>
                                    <button onClick={() => handleAction("¿Cómo está el búnker?")} className="flex-shrink-0 bg-zinc-900 px-4 py-2 rounded-xl text-[10px] font-bold border border-zinc-800 flex items-center gap-2">
                                        <Bell size={12}/> STATUS
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 space-y-4 hide-scroll">
                                    {messages.map(m => (
                                        <div key={m.id} className={`flex ${m.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`p-4 rounded-2xl max-w-[88%] text-[13px] border ${m.type === 'user' ? 'bg-orange-600 text-black border-orange-400 font-bold shadow-lg' : 'bg-zinc-950 border-zinc-900 text-zinc-100'}`}>
                                                <pre className="whitespace-pre-wrap font-mono">{m.text}</pre>
                                            </div>
                                        </div>
                                    ))}
                                    {loading && <div className="text-[10px] animate-pulse text-zinc-500 font-bold tracking-widest">PROCESANDO COMANDO...</div>}
                                    <div ref={scrollRef} />
                                </div>

                                <div className="p-4 glass-panel border-t border-zinc-900">
                                    <div className="flex gap-2">
                                        <input 
                                            className="flex-1 bg-zinc-900 border border-zinc-800 rounded-2xl p-4 text-sm text-white font-mono outline-none focus:border-orange-600 transition-colors"
                                            placeholder="Ingresa comando maestro..."
                                            value={input}
                                            onChange={e => setInput(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && handleAction()}
                                        />
                                        <button onClick={() => handleAction()} className="p-4 bg-orange-600 text-black rounded-2xl font-bold shadow-[0_0_20px_rgba(255,69,0,0.3)] active:scale-95">
                                            <Send size={24} />
                                        </button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="p-8 space-y-8 overflow-y-auto">
                                <div className="flex items-center gap-2 border-b border-zinc-800 pb-2">
                                    <Info size={16} />
                                    <h2 className="text-xs font-black uppercase tracking-widest">Configuración APK</h2>
                                </div>
                                
                                <div className="space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-zinc-500 uppercase">Dirección IP (Bridge)</label>
                                        <input 
                                            type="text" 
                                            className="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-xs text-orange-400 font-mono" 
                                            value={termuxUrl} 
                                            onChange={e => {setTermuxUrl(e.target.value); localStorage.setItem('konre_ip', e.target.value);}} 
                                        />
                                    </div>
                                    
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-bold text-zinc-500 uppercase">Gemini API Key</label>
                                        <input 
                                            type="password" 
                                            className="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-xl text-xs text-white" 
                                            value={apiKey} 
                                            onChange={e => {setApiKey(e.target.value); localStorage.setItem('konre_key', e.target.value);}} 
                                        />
                                    </div>
                                </div>

                                <div className="pt-10 flex flex-col gap-4">
                                    <button onClick={() => window.location.reload()} className="w-full p-4 bg-zinc-900 border border-zinc-800 rounded-xl text-[10px] font-bold text-white uppercase">Reiniciar App</button>
                                    <button onClick={() => {if(confirm("¿Borrar historial?")){localStorage.clear(); window.location.reload();}}} className="w-full p-4 border border-red-900/20 text-red-600 rounded-xl text-[10px] font-bold uppercase">Purgar Datos</button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
