<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KONRE // BÜNKER OS</title>
    <!-- Scripts de React y Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; background-color: #030712; margin: 0; color: #e2e8f0; }
        .crt-effect { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); z-index: 50; background-size: 100% 2px, 3px 100%; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="crt-effect"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isAuth, setIsAuth] = useState(false);
            const [passKey, setPassKey] = useState("");
            const [view, setView] = useState("chat");
            const [messages, setMessages] = useState([]);
            const [userInput, setUserInput] = useState("");
            const [isSearching, setIsSearching] = useState(false);
            const [records, setRecords] = useState(() => {
                const saved = localStorage.getItem('bunker_vault_records');
                return saved ? JSON.parse(saved) : [];
            });

            const chatEndRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('bunker_vault_records', JSON.stringify(records));
            }, [records]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, isSearching]);

            const validateAuth = () => {
                if (passKey.toLowerCase() === "peniche") {
                    setIsAuth(true);
                    addMessage("SISTEMA", "Protocolo KONRE iniciado. Esperando validación de credenciales...", "system");
                    setTimeout(() => {
                        addMessage("KONRE", "Acceso concedido. Bienvenido al Bünker, Copetes. Todos los sistemas de búsqueda real están en línea.", "ai");
                    }, 1000);
                } else {
                    setPassKey("");
                }
            };

            const addMessage = (sender, text, type = "user", sources = []) => {
                setMessages(prev => [...prev, { id: Date.now(), sender, text, type, sources }]);
            };

            const handleSend = async () => {
                if (!userInput.trim()) return;
                const query = userInput;
                addMessage("COPETES", query, "user");
                setUserInput("");
                setIsSearching(true);

                try {
                    const apiKey = ""; // Inyectado por el entorno
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Eres KONRE, una IA de ingeniería para el búnker de Copetes. Responde de forma técnica y precisa a: ${query}` }] }],
                            tools: [{ "google_search": {} }]
                        })
                    });

                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Fallo en el enlace de datos. Reintentando...";
                    const aiSources = data.candidates?.[0]?.groundingMetadata?.groundingAttributions?.map(a => ({
                        title: a.web?.title,
                        uri: a.web?.uri
                    })) || [];

                    addMessage("KONRE", aiText, "ai", aiSources);
                } catch (error) {
                    addMessage("SISTEMA", "Error de conexión con el núcleo.", "system");
                } finally {
                    setIsSearching(false);
                }
            };

            if (!isAuth) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center p-6 bg-slate-950">
                        <div className="w-full max-w-sm space-y-8 text-center">
                            <h1 className="text-3xl font-black italic tracking-tighter text-sky-500">BÜNKER CORE</h1>
                            <div className="bg-slate-900/50 border border-sky-900/30 p-8 rounded-3xl backdrop-blur-xl">
                                <p className="text-[10px] text-sky-700 mb-6 tracking-[0.3em] font-bold uppercase">Security Level: Elite</p>
                                <input 
                                    type="password"
                                    value={passKey}
                                    onChange={(e) => setPassKey(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && validateAuth()}
                                    placeholder="LLAVE MAESTRA"
                                    className="w-full bg-black border border-sky-900/50 p-4 rounded-xl text-center text-sky-400 focus:outline-none focus:border-sky-500 tracking-[0.5em] mb-4 text-xs"
                                />
                                <button onClick={validateAuth} className="w-full py-4 bg-sky-600 rounded-xl font-bold text-[10px] tracking-widest text-white hover:bg-sky-500 transition-all">DESBLOQUEAR TERMINAL</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col bg-slate-950">
                    <header className="p-4 border-b border-sky-900/20 flex justify-between items-center bg-black/40">
                        <div className="flex flex-col">
                            <span className="text-[11px] font-bold text-sky-500 tracking-widest">KONRE // OS</span>
                            <span className="text-[7px] text-sky-800 tracking-tighter uppercase font-bold">Grounded & Verified</span>
                        </div>
                        <div className="flex bg-slate-900 p-1 rounded-lg">
                            <button onClick={() => setView("chat")} className={`px-4 py-1.5 text-[9px] font-bold rounded-md transition-all ${view === 'chat' ? 'bg-sky-600 text-white' : 'text-gray-500'}`}>CONSULTAS</button>
                            <button onClick={() => setView("vault")} className={`px-4 py-1.5 text-[9px] font-bold rounded-md transition-all ${view === 'vault' ? 'bg-sky-600 text-white' : 'text-gray-500'}`}>BÚNKER</button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden flex flex-col">
                        {view === 'chat' ? (
                            <>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                                    {messages.map(msg => (
                                        <div key={msg.id} className={`flex flex-col ${msg.type === 'user' ? 'items-end' : 'items-start'}`}>
                                            <span className="text-[7px] text-slate-600 uppercase mb-1 font-bold">{msg.sender}</span>
                                            <div className={`p-4 rounded-2xl text-[10.5px] max-w-[92%] leading-relaxed ${msg.type === 'user' ? 'bg-sky-900/20 text-sky-100 border border-sky-900/30' : 'bg-slate-900 text-slate-200 border border-slate-800'}`}>
                                                {msg.text}
                                                {msg.sources?.length > 0 && (
                                                    <div className="mt-3 flex flex-wrap gap-1 border-t border-slate-800 pt-2">
                                                        {msg.sources.map((s, i) => (
                                                            <span key={i} className="text-[7px] bg-sky-950 text-sky-400 px-2 py-0.5 rounded border border-sky-900/30">
                                                                {s.title?.substring(0, 25)}...
                                                            </span>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                    {isSearching && (
                                        <div className="flex items-center gap-2 text-sky-600 animate-pulse p-4 text-[9px]">
                                            <span>Escaneando redes de ingeniería...</span>
                                        </div>
                                    )}
                                    <div ref={chatEndRef} />
                                </div>
                                <div className="p-4 border-t border-sky-900/10 bg-black/20">
                                    <div className="flex gap-2">
                                        <input 
                                            value={userInput}
                                            onChange={(e) => setUserInput(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                            className="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs focus:outline-none focus:border-sky-800"
                                            placeholder="Escribe tu consulta técnica..."
                                        />
                                        <button onClick={handleSend} className="p-3 bg-sky-600 rounded-xl text-white">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                                        </button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="p-6 overflow-y-auto custom-scrollbar flex-1">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-[10px] font-bold text-sky-500 uppercase tracking-widest">Base de Datos Bunker</h3>
                                    <button onClick={() => {
                                        const title = prompt("NOMBRE DEL PROYECTO/BONG:");
                                        const specs = prompt("ESPECIFICACIONES TÉCNICAS:");
                                        if (title && specs) setRecords([...records, { id: Date.now(), title, specs, date: new Date().toLocaleDateString() }]);
                                    }} className="bg-sky-600 px-4 py-2 rounded-xl text-[9px] font-bold text-white shadow-lg shadow-sky-900/20">REGISTRAR</button>
                                </div>
                                {records.length === 0 ? (
                                    <div className="text-center py-20 border-2 border-dashed border-slate-900 rounded-3xl">
                                        <p className="text-slate-700 text-[10px] uppercase font-bold tracking-widest">Bóveda vacía. Registre su primer proyecto.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 gap-4">
                                        {records.map(record => (
                                            <div key={record.id} className="p-5 bg-slate-900 border border-slate-800 rounded-2xl relative overflow-hidden">
                                                <div className="absolute top-0 left-0 w-1.5 h-full bg-sky-500"></div>
                                                <div className="flex justify-between items-center mb-3">
                                                    <span className="text-[8px] text-slate-500 font-bold uppercase tracking-widest">REG: {record.date}</span>
                                                    <button onClick={() => setRecords(records.filter(r => r.id !== record.id))} className="text-slate-700 hover:text-red-500 transition-colors">
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                    </button>
                                                </div>
                                                <h4 className="text-xs font-bold uppercase text-sky-100">{record.title}</h4>
                                                <p className="text-[10px] text-slate-500 mt-2 leading-relaxed">{record.specs}</p>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                    <footer className="p-3 bg-black border-t border-sky-900/10 flex justify-between items-center opacity-40">
                         <span className="text-[6px] tracking-widest font-bold">CPU: {Math.floor(Math.random() * 20 + 10)}% MEM: 1.2GB/4GB</span>
                         <span className="text-[6px] tracking-widest font-bold">PENICHE INTERFACE v2.5</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
