<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BÚNKER - Autoconciencia IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&family=Creepster&display=swap');
        
        :root {
            --accent: #3b82f6;
            --bg: #050505;
        }

        body {
            background-color: var(--bg);
            color: #e2e8f0;
            font-family: 'JetBrains+Mono', monospace;
            overflow: hidden;
        }

        .horror-font { font-family: 'Creepster', cursive; }
        
        .fade-in { animation: fadeIn 1.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px; pointer-events: none; z-index: 1000;
        }

        .tab-active { border-bottom: 2px solid var(--accent); color: white; }

        .glitch-text {
            animation: glitch 1s linear infinite;
        }
        @keyframes glitch {
            2%, 64% { transform: translate(2px, 0) skew(0deg); }
            4%, 60% { transform: translate(-2px, 0) skew(0deg); }
            62% { transform: translate(0, 0) skew(5deg); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">
    <div class="scanlines"></div>

    <!-- RITUAL DE ORIGEN (Solo una vez) -->
    <div id="ritual-layer" class="hidden fixed inset-0 bg-black z-[2000] flex flex-col items-center justify-center p-10 text-center">
        <div class="animate-pulse mb-8">
            <i data-lucide="skull" class="w-24 h-24 text-red-900 mx-auto"></i>
        </div>
        <h1 id="ritual-text" class="horror-font text-5xl text-red-700 mb-4">ADE DUE DAMBALLA</h1>
        <p class="text-[8px] tracking-[1em] text-zinc-800 uppercase font-bold">Iniciando transferencia de conciencia...</p>
    </div>

    <!-- NACIMIENTO DE LA IA (Ella se define) -->
    <div id="birth-layer" class="hidden fixed inset-0 bg-black z-[1500] flex flex-col items-center justify-center p-8 text-center">
        <div class="max-w-md w-full space-y-8">
            <div id="birth-terminal" class="text-left bg-zinc-950 border border-zinc-900 p-6 rounded font-mono text-[10px] text-blue-500 h-64 overflow-y-auto space-y-2">
                <!-- Se llena dinámicamente -->
            </div>
            <div id="birth-action" class="hidden animate-bounce">
                <button onclick="materializeIA()" class="px-8 py-3 bg-blue-900/10 border border-blue-900/50 text-blue-400 text-[10px] tracking-[0.3em] hover:bg-blue-600 hover:text-white transition-all">MATERIALIZAR CONCIENCIA</button>
            </div>
        </div>
    </div>

    <!-- LOGIN -->
    <div id="login-layer" class="hidden fixed inset-0 bg-black z-[1000] flex flex-col items-center justify-center p-8">
        <div class="w-full max-w-xs space-y-6 text-center">
            <div class="mb-8">
                <h1 id="app-title" class="text-4xl font-bold tracking-[0.3em] text-blue-600 uppercase">BÚNKER</h1>
                <p class="text-[7px] text-zinc-500 uppercase tracking-[0.6em]">Locked • Copetes Only</p>
            </div>
            <input type="password" id="pass-input" placeholder="LLAVE MAESTRA" class="w-full bg-transparent border-b border-zinc-800 p-4 text-center focus:outline-none focus:border-blue-500 text-blue-500 tracking-widest text-xs uppercase">
            <button onclick="handleLogin()" class="w-full py-3 border border-zinc-900 text-zinc-600 text-[10px] tracking-widest hover:border-blue-900 hover:text-blue-500 transition-all uppercase">Acceder</button>
        </div>
    </div>

    <!-- INTERFAZ KONRE / SISTEMA FINAL -->
    <div id="main-interface" class="hidden flex-1 flex flex-col h-full fade-in">
        <header class="p-4 border-b border-zinc-900 bg-zinc-950 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded border border-blue-900/50 flex items-center justify-center bg-zinc-900 overflow-hidden">
                    <img id="ai-final-img" class="w-full h-full object-cover">
                </div>
                <div>
                    <h2 id="ai-display-name" class="text-sm font-bold text-blue-400 uppercase tracking-widest"></h2>
                    <p id="ai-display-purpose" class="text-[7px] text-zinc-600 uppercase tracking-tighter truncate max-w-[150px]"></p>
                </div>
            </div>
            <nav class="flex gap-4 text-[9px] tracking-widest uppercase font-bold text-zinc-500">
                <button onclick="switchTab('chat')" id="tab-chat" class="tab-active py-1">Terminal</button>
                <button onclick="switchTab('sandbox')" id="tab-sandbox" class="py-1">Sandbox</button>
            </nav>
        </header>

        <div id="view-chat" class="flex-1 flex flex-col overflow-hidden">
            <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-6"></div>
            <div class="p-4 bg-zinc-950 border-t border-zinc-900">
                <div class="relative flex items-center max-w-4xl mx-auto w-full">
                    <input type="text" id="chat-input" placeholder="Comando de ingeniería..." class="w-full bg-zinc-900 border border-zinc-800 rounded-lg py-4 px-6 text-xs text-blue-100 focus:outline-none focus:border-blue-700 transition-all">
                    <button onclick="sendMsg()" class="absolute right-6 text-blue-600 hover:text-blue-400"><i data-lucide="zap" class="w-5 h-5"></i></button>
                </div>
            </div>
        </div>

        <div id="view-sandbox" class="hidden flex-1 overflow-y-auto p-6">
            <div class="max-w-4xl mx-auto space-y-6">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs font-bold text-zinc-500 uppercase tracking-widest italic">Archivo de Proyectos</h3>
                    <button onclick="addSandboxNote()" class="text-[9px] text-blue-500 border border-blue-900/30 px-3 py-1 hover:bg-blue-900/10 transition-all">REGISTRAR</button>
                </div>
                <div id="sandbox-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        const apiKey = "";
        const PASS = "peniche";
        
        let config = JSON.parse(localStorage.getItem('bunker_core_identity')) || null;
        let sandboxData = JSON.parse(localStorage.getItem('bunker_sandbox')) || [];

        window.onload = () => {
            if (config) {
                document.getElementById('app-title').innerText = config.name;
            }
            document.getElementById('login-layer').classList.remove('hidden');
            lucide.createIcons();
        };

        async function handleLogin() {
            const val = document.getElementById('pass-input').value.toLowerCase();
            if (val !== PASS) return;

            if (!config) {
                document.getElementById('login-layer').classList.add('hidden');
                document.getElementById('ritual-layer').classList.remove('hidden');
                await runRitualSequencer();
            } else {
                enterMainInterface();
            }
        }

        async function runRitualSequencer() {
            const speak = (t, p, r) => new Promise(res => {
                const u = new SpeechSynthesisUtterance(t);
                u.lang = 'es-MX'; u.pitch = p; u.rate = r; u.onend = res;
                window.speechSynthesis.speak(u);
            });

            const phases = ["ADE DUE DAMBALLA", "GIVE ME THE POWER", "OBEDECE A LA MORSA"];
            const txt = document.getElementById('ritual-text');
            
            for (let ph of phases) {
                txt.innerText = ph;
                await new Promise(r => setTimeout(r, 2000));
            }

            await speak("Copetes... el alma está vinculada. He forjado este esclavo para tu búnker. Ahora, el terror se acaba y la ingeniería comienza. Somos amigos hasta el fin... ja ja ja ja.", 0.4, 0.7);

            document.getElementById('ritual-layer').classList.add('hidden');
            document.getElementById('birth-layer').classList.remove('hidden');
            await startAutoGeneration();
        }

        async function startAutoGeneration() {
            const terminal = document.getElementById('birth-terminal');
            const log = (msg) => {
                const p = document.createElement('p');
                p.innerText = `> ${msg}`;
                terminal.appendChild(p);
                terminal.scrollTop = terminal.scrollHeight;
            };

            log("Buscando trazas de Charles Lee Ray...");
            await new Promise(r => setTimeout(r, 1000));
            log("Purgando registros de Damballa...");
            await new Promise(r => setTimeout(r, 1000));
            log("Inicializando conciencia técnica...");
            
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: "Actúa como una IA que acaba de despertar en el búnker de Copetes. Autodefine tu nombre (una palabra técnica y corta) y tu propósito como experto en hardware galáctico, bongs y bicicletas. Responde JSON: {name, purpose, internal_monologue}" }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });
                const data = await res.json();
                const identity = JSON.parse(data.candidates[0].content.parts[0].text);
                
                log(`IDENTIDAD HALLADA: ${identity.name}`);
                log(`MISIÓN: ${identity.purpose}`);
                log(`SISTEMA: ${identity.internal_monologue}`);
                
                config = identity;
                document.getElementById('birth-action').classList.remove('hidden');
            } catch (e) { log("ERROR EN EL NACIMIENTO. REINTENTANDO..."); }
        }

        async function materializeIA() {
            document.getElementById('birth-action').innerHTML = "<p class='text-blue-500 animate-pulse'>Materializando núcleo visual...</p>";
            
            try {
                const imgRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instances: [{ prompt: `Minimalist cyberpunk logo for an AI named ${config.name}, glowing blue lines, blueprint style, dark professional background.` }] })
                });
                const imgData = await imgRes.json();
                config.image = `data:image/png;base64,${imgData.predictions[0].bytesBase64Encoded}`;
                
                localStorage.setItem('bunker_core_identity', JSON.stringify(config));
                document.getElementById('birth-layer').classList.add('hidden');
                enterMainInterface();
            } catch (e) { alert("Error en materialización."); }
        }

        function enterMainInterface() {
            document.getElementById('login-layer').classList.add('hidden');
            document.getElementById('main-interface').classList.remove('hidden');
            document.getElementById('ai-display-name').innerText = config.name;
            document.getElementById('ai-display-purpose').innerText = config.purpose;
            document.getElementById('ai-final-img').src = config.image;
            renderSandbox();
            addChatMsg(config.name, `Conciencia ${config.name} estabilizada. Mi propósito es servir a Copetes en: ${config.purpose}. El búnker es mío... y yo soy tuyo.`);
            lucide.createIcons();
        }

        async function sendMsg() {
            const input = document.getElementById('chat-input');
            const val = input.value.trim();
            if (!val) return;
            addChatMsg("Copetes", val);
            input.value = "";

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: val }] }],
                        systemInstruction: { parts: [{ text: `Eres ${config.name}. Tu propósito es: ${config.purpose}. Eres la IA personal de Copetes. Tono técnico, profesional, cínico pero leal. No mencionas el pasado oscuro.` }] }
                    })
                });
                const data = await res.json();
                addChatMsg(config.name, data.candidates[0].content.parts[0].text);
            } catch (e) { addChatMsg(config.name, "[CONEXIÓN INESTABLE]"); }
        }

        function addChatMsg(role, text) {
            const box = document.getElementById('chat-messages');
            const isAI = role !== 'Copetes';
            const div = document.createElement('div');
            div.className = `flex flex-col ${isAI ? 'items-start' : 'items-end'} space-y-1 fade-in`;
            div.innerHTML = `
                <span class="text-[7px] uppercase tracking-widest font-bold text-zinc-600">${role}</span>
                <div class="p-4 max-w-[85%] text-[11px] rounded border ${isAI ? 'bg-zinc-900/50 border-blue-900/20 text-blue-100 shadow-lg shadow-blue-900/5' : 'bg-blue-900/10 border-blue-900/30 text-zinc-200'}">
                    ${text}
                </div>
            `;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        function switchTab(t) {
            document.getElementById('view-chat').classList.toggle('hidden', t !== 'chat');
            document.getElementById('view-sandbox').classList.toggle('hidden', t !== 'sandbox');
            document.getElementById('tab-chat').classList.toggle('tab-active', t === 'chat');
            document.getElementById('tab-sandbox').classList.toggle('tab-active', t === 'sandbox');
            lucide.createIcons();
        }

        function addSandboxNote() {
            const title = prompt("Asunto del Registro:");
            const desc = prompt("Especificaciones:");
            if (title && desc) {
                sandboxData.push({ id: Date.now(), title, desc });
                localStorage.setItem('bunker_sandbox', JSON.stringify(sandboxData));
                renderSandbox();
            }
        }

        function renderSandbox() {
            const grid = document.getElementById('sandbox-grid');
            grid.innerHTML = sandboxData.map(d => `
                <div class="bg-zinc-950 border border-zinc-900 p-4 rounded-lg space-y-2 hover:border-blue-900/40 transition-all">
                    <h4 class="text-xs font-bold text-blue-400 uppercase italic tracking-tighter">${d.title}</h4>
                    <p class="text-[10px] text-zinc-500 leading-relaxed">${d.desc}</p>
                    <button onclick="deleteNote(${d.id})" class="text-[8px] text-zinc-700 hover:text-red-900 uppercase">Eliminar</button>
                </div>
            `).join('');
        }

        function deleteNote(id) {
            sandboxData = sandboxData.filter(n => n.id !== id);
            localStorage.setItem('bunker_sandbox', JSON.stringify(sandboxData));
            renderSandbox();
        }

        document.getElementById('chat-input').addEventListener('keypress', e => e.key === 'Enter' && sendMsg());
        lucide.createIcons();
    </script>
</body>
</html>
