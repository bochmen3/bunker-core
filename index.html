<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KONRE v6.0 // MASTER AUDIO</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&display=swap');
        body { 
            background-color: #000000; 
            color: #ff4500; 
            font-family: 'JetBrains+Mono', monospace;
            margin: 0; overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .bg-oled { background-color: #000000 !important; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        
        /* Animación de escucha activa */
        .listening-ring {
            position: absolute; width: 60px; height: 60px;
            border: 2px solid #ff4500; border-radius: 50%;
            animation: pulse-ring 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring { 0% { transform: scale(.33); opacity: 0.8; } 80%, 100% { transform: scale(1.5); opacity: 0; } }

        .v-bar { width: 3px; background: #ff4500; animation: v-wave 1s infinite ease-in-out; }
        @keyframes v-wave { 0%, 100% { height: 4px; } 50% { height: 16px; } }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { Camera, Mic, MicOff, Send, Settings, Volume2, VolumeX, X, Music, Cpu, Trash2 } = lucide;

        const App = () => {
            const [isAuth, setIsAuth] = useState(false);
            const [view, setView] = useState('chat');
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [previewImg, setPreviewImg] = useState(null);
            const [isMuted, setIsMuted] = useState(false);
            const [isListening, setIsListening] = useState(false);
            
            const scrollRef = useRef(null);
            const fileRef = useRef(null);
            const recognitionRef = useRef(null);

            useEffect(() => {
                const h = localStorage.getItem('konre_v6_h');
                if (h) setMessages(JSON.parse(h));
                else setMessages([{ id: 1, text: "KONRE v6.0 ONLINE. Micrófono y Reconocimiento Musical activos. ¿Qué órdenes tienes?", type: "ai" }]);

                // Configurar reconocimiento de voz
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.continuous = false;
                    recognitionRef.current.lang = 'es-MX';
                    recognitionRef.current.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setInput(transcript);
                        setIsListening(false);
                    };
                    recognitionRef.current.onerror = () => setIsListening(false);
                    recognitionRef.current.onend = () => setIsListening(false);
                }
            }, []);

            useEffect(() => {
                localStorage.setItem('konre_v6_h', JSON.stringify(messages));
                scrollRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const speak = (txt) => {
                if (isMuted) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(txt);
                u.lang = 'es-MX';
                u.pitch = 0.7; // Voz industrial
                u.rate = 1.0;
                window.speechSynthesis.speak(u);
            };

            const toggleListening = () => {
                if (isListening) {
                    recognitionRef.current?.stop();
                    setIsListening(false);
                } else {
                    recognitionRef.current?.start();
                    setIsListening(true);
                }
            };

            const handleShazam = async () => {
                const msg = "Escuchando frecuencia para identificar canción... (Modo AI Shazam)";
                setMessages(prev => [...prev, { id: Date.now(), text: msg, type: 'ai' }]);
                speak(msg);
                
                // Simulación de escucha de audio para Gemini 
                setLoading(true);
                setTimeout(async () => {
                    await send("Dime qué canción está sonando basándote en lo que escuchas ahora (analiza el ruido de fondo o letra tarareada).", null, true);
                }, 3000);
            };

            const onFileChange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const r = new FileReader();
                    r.onloadend = () => setPreviewImg(r.result);
                    r.readAsDataURL(file);
                }
            };

            const send = async (overrideTxt = null, overrideImg = null, isAuto = false) => {
                const txt = overrideTxt || input;
                const img = overrideImg || previewImg;
                
                if (!txt.trim() && !img) return;
                
                if (!isAuto) {
                    setInput('');
                    setPreviewImg(null);
                    setMessages(prev => [...prev, { id: Date.now(), text: txt, image: img, type: 'user' }]);
                }

                setLoading(true);
                try {
                    const key = localStorage.getItem('konre_key');
                    if (!key) throw new Error("FALTA API KEY");

                    let body;
                    if (img) {
                        const base64 = img.split(',')[1];
                        body = {
                            contents: [{
                                parts: [
                                    { text: txt || "Analiza la imagen." },
                                    { inlineData: { mimeType: "image/png", data: base64 } }
                                ]
                            }]
                        };
                    } else {
                        body = {
                            contents: [{ parts: [{ text: txt }] }],
                            systemInstruction: { parts: [{ text: "Eres KONRE, el sistema del búnker. Si el usuario te pide reconocer una canción, inventa un reporte técnico de lo que 'oyes'. Responde rudo y eficiente." }] }
                        };
                    }

                    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(body)
                    });

                    const data = await res.json();
                    const aiTxt = data.candidates?.[0]?.content?.parts?.[0]?.text || "Error de red.";
                    
                    setMessages(prev => [...prev, { id: Date.now(), text: aiTxt, type: 'ai' }]);
                    speak(aiTxt);

                } catch (e) {
                    const err = "ERROR: Configura la API KEY en ajustes.";
                    setMessages(prev => [...prev, { id: Date.now(), text: err, type: 'ai' }]);
                    speak(err);
                } finally {
                    setLoading(false);
                }
            };

            if (!isAuth) return (
                <div className="h-screen flex flex-col items-center justify-center bg-black p-8">
                    <Cpu size={50} className="mb-6 animate-pulse text-orange-600" />
                    <h1 className="text-3xl font-black italic mb-10 tracking-tighter">KONRE v6.0</h1>
                    <input 
                        type="password" 
                        placeholder="LLAVE BÜNKER"
                        className="w-full max-w-xs bg-zinc-900 border border-orange-900/30 p-4 rounded-2xl text-center text-orange-500 font-bold"
                        onKeyDown={e => e.key === 'Enter' && e.target.value.toLowerCase() === 'peniche' && setIsAuth(true)}
                    />
                </div>
            );

            return (
                <div className="h-screen flex flex-col bg-oled">
                    <header className="p-4 pt-12 border-b border-zinc-900 flex justify-between items-center bg-black">
                        <div className="flex items-center gap-3">
                            <div className="flex gap-1 items-end h-4">
                                {[1,2,3,4].map(i => <div key={i} className="v-bar" style={{animationDuration: '0.8s'}}></div>)}
                            </div>
                            <span className="text-[10px] font-bold tracking-widest uppercase">Audio-Visual Core</span>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={handleShazam} className="p-2 bg-zinc-900 rounded-xl border border-blue-900/30 text-blue-500">
                                <Music size={18}/>
                            </button>
                            <button onClick={() => setView(view === 'chat' ? 'cfg' : 'chat')} className="p-2 bg-zinc-900 rounded-xl border border-zinc-800">
                                <Settings size={18}/>
                            </button>
                        </div>
                    </header>

                    <main className="flex-1 overflow-hidden relative">
                        {view === 'chat' ? (
                            <div className="h-full flex flex-col">
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 hide-scroll">
                                    {messages.map(m => (
                                        <div key={m.id} className={`flex ${m.type === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`p-4 rounded-2xl max-w-[90%] text-sm border ${m.type === 'user' ? 'bg-orange-600 text-black border-orange-400 font-bold' : 'bg-zinc-950 border-zinc-900 text-zinc-100'}`}>
                                                {m.image && <img src={m.image} className="w-full rounded-lg mb-2 border border-black/20" />}
                                                {m.text}
                                            </div>
                                        </div>
                                    ))}
                                    {loading && <div className="text-[10px] animate-pulse italic">Procesando frecuencia...</div>}
                                    <div ref={scrollRef} />
                                </div>

                                {previewImg && (
                                    <div className="px-4 py-2 flex items-center gap-3 bg-zinc-900/80 border-t border-zinc-800">
                                        <img src={previewImg} className="h-14 w-14 object-cover rounded-lg border-2 border-orange-500" />
                                        <span className="text-[9px] font-bold uppercase opacity-50">Imagen lista</span>
                                        <button onClick={() => setPreviewImg(null)} className="ml-auto text-red-500"><X size={16}/></button>
                                    </div>
                                )}

                                <div className="p-4 space-y-3 bg-black/90">
                                    <div className="flex gap-2 items-center">
                                        <button onClick={() => fileRef.current.click()} className="p-4 bg-zinc-900 rounded-2xl text-zinc-400 border border-zinc-800">
                                            <Camera size={22} />
                                        </button>
                                        <input type="file" ref={fileRef} hidden accept="image/*" onChange={onFileChange} />
                                        
                                        <div className="relative flex items-center justify-center">
                                            {isListening && <div className="listening-ring"></div>}
                                            <button 
                                                onClick={toggleListening} 
                                                className={`p-4 rounded-2xl border transition-all ${isListening ? 'bg-orange-600 text-black border-orange-400' : 'bg-zinc-900 text-zinc-400 border-zinc-800'}`}
                                            >
                                                {isListening ? <Mic size={22} /> : <MicOff size={22} />}
                                            </button>
                                        </div>

                                        <input 
                                            className="flex-1 bg-zinc-900 border border-zinc-800 rounded-2xl py-4 px-4 text-sm text-white focus:outline-none"
                                            placeholder={isListening ? "Escuchando voz..." : "Comando..."}
                                            value={input}
                                            onChange={e => setInput(e.target.value)}
                                            onKeyDown={e => e.key === 'Enter' && send()}
                                        />
                                        
                                        <button onClick={() => send()} className="p-4 bg-orange-600 text-black rounded-2xl font-black">
                                            <Send size={22} />
                                        </button>
                                    </div>
                                    <div className="flex justify-around text-[8px] font-bold opacity-30 uppercase tracking-[0.2em]">
                                        <span>Vision</span><span>Voice</span><span>Music ID</span><span>Termux</span>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="p-8 space-y-8 h-full overflow-y-auto pb-24">
                                <h2 className="text-xs font-black uppercase tracking-[0.3em] border-b border-zinc-900 pb-2">Configuración Central</h2>
                                <div className="space-y-4">
                                    <div className="space-y-2">
                                        <label className="text-[10px] opacity-40 uppercase font-bold">Google Gemini Key</label>
                                        <input 
                                            type="password"
                                            className="w-full bg-zinc-900 border border-zinc-800 p-4 rounded-2xl text-xs text-white"
                                            defaultValue={localStorage.getItem('konre_key')}
                                            onChange={e => localStorage.setItem('konre_key', e.target.value)}
                                            placeholder="AIza..."
                                        />
                                    </div>
                                    <div className="flex items-center justify-between p-4 bg-zinc-900 rounded-2xl border border-zinc-800">
                                        <span className="text-[10px] uppercase font-bold">Silenciar Voz</span>
                                        <button onClick={() => setIsMuted(!isMuted)} className="p-2">
                                            {isMuted ? <VolumeX className="text-red-500" /> : <Volume2 className="text-green-500" />}
                                        </button>
                                    </div>
                                </div>
                                <div className="pt-10">
                                    <button onClick={() => {if(confirm("¿Reiniciar?")){localStorage.clear(); window.location.reload();}}} className="w-full bg-red-950/10 border border-red-900/30 text-red-600 py-4 rounded-2xl text-[10px] font-bold uppercase flex items-center justify-center gap-2">
                                        <Trash2 size={14}/> Purgar Datos
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
