<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KONRE // BÜNKER ELITE OS</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap');
        body { font-family: 'JetBrains+Mono', monospace; background-color: #020617; margin: 0; color: #f8fafc; overflow: hidden; }
        .scanlines { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.05) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.02), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.02)); z-index: 99; background-size: 100% 3px, 3px 100%; pointer-events: none; }
        .glow { text-shadow: 0 0 10px rgba(14, 165, 233, 0.5); }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .custom-scrollbar::-webkit-scrollbar { width: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #0ea5e9; }
    </style>
</head>
<body>
    <div id="root"></div>
    <div class="scanlines"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [isAuth, setIsAuth] = useState(false);
            const [passKey, setPassKey] = useState("");
            const [view, setView] = useState("chat");
            const [messages, setMessages] = useState([]);
            const [userInput, setUserInput] = useState("");
            const [isSearching, setIsSearching] = useState(false);
            const [isListening, setIsListening] = useState(false);
            const [telemetry, setTelemetry] = useState({ cpu: 12, temp: 34, net: 0.5 });
            const [records, setRecords] = useState(() => JSON.parse(localStorage.getItem('bunker_vault_v3')) || []);

            const chatEndRef = useRef(null);
            const recognitionRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('bunker_vault_v3', JSON.stringify(records));
                
                // Configuración de Reconocimiento de Voz
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.lang = 'es-ES';
                    recognitionRef.current.continuous = false;
                    recognitionRef.current.onresult = (event) => {
                        const transcript = event.results[0][0].transcript;
                        setUserInput(transcript);
                        setIsListening(false);
                    };
                    recognitionRef.current.onerror = () => setIsListening(false);
                }

                // Simulación de telemetría (Gates)
                const interval = setInterval(() => {
                    setTelemetry({
                        cpu: Math.floor(Math.random() * 40 + 10),
                        temp: Math.floor(Math.random() * 10 + 35),
                        net: (Math.random() * 2).toFixed(2)
                    });
                }, 3000);
                return () => clearInterval(interval);
            }, [records]);

            useEffect(() => {
                chatEndRef.current?.scrollIntoView({ behavior: "smooth" });
            }, [messages, isSearching]);

            const speakText = (text) => {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 1.1;
                window.speechSynthesis.speak(utterance);
            };

            const validateAuth = () => {
                if (passKey.toLowerCase() === "peniche") {
                    setIsAuth(true);
                    const msg = "Sistemas KONRE Ultra activados. Bienvenido al Bünker.";
                    addMessage("SISTEMA", msg, "system");
                    speakText(msg);
                } else {
                    setPassKey("");
                }
            };

            const addMessage = (sender, text, type = "user", sources = []) => {
                setMessages(prev => [...prev, { id: Date.now(), sender, text, type, sources }]);
            };

            const toggleListening = () => {
                if (isListening) {
                    recognitionRef.current?.stop();
                    setIsListening(false);
                } else {
                    recognitionRef.current?.start();
                    setIsListening(true);
                }
            };

            const handleSend = async (overrideInput = null) => {
                const textToSend = overrideInput || userInput;
                if (!textToSend.trim()) return;
                
                addMessage("COPETES", textToSend, "user");
                setUserInput("");
                setIsSearching(true);

                try {
                    const apiKey = ""; // La API Key se inyecta en ejecución
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Eres KONRE Ultra, IA de ingeniería avanzada. Responde breve y técnicamente. Consulta: ${textToSend}` }] }],
                            tools: [{ "google_search": {} }]
                        })
                    });

                    const data = await response.json();
                    const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Fallo en enlace.";
                    const aiSources = data.candidates?.[0]?.groundingMetadata?.groundingAttributions?.map(a => ({ title: a.web?.title, uri: a.web?.uri })) || [];

                    addMessage("KONRE", aiText, "ai", aiSources);
                    speakText(aiText);
                } catch (error) {
                    addMessage("SISTEMA", "ERROR DE ENLACE NEURONAL.", "system");
                } finally {
                    setIsSearching(false);
                }
            };

            if (!isAuth) {
                return (
                    <div className="h-screen w-full flex items-center justify-center bg-slate-950 p-6">
                        <div className="w-full max-w-sm space-y-8 animate-pulse">
                            <h1 className="text-4xl font-black italic tracking-tighter text-sky-500 text-center">BÜNKER ELITE</h1>
                            <div className="bg-slate-900 border border-sky-900/40 p-10 rounded-[2.5rem] backdrop-blur-md">
                                <input 
                                    type="password"
                                    value={passKey}
                                    onChange={(e) => setPassKey(e.target.value)}
                                    onKeyPress={(e) => e.key === 'Enter' && validateAuth()}
                                    placeholder="LLAVE MAESTRA"
                                    className="w-full bg-black border border-sky-900/50 p-5 rounded-2xl text-center text-sky-400 focus:outline-none tracking-[0.5em] text-xs mb-4"
                                />
                                <button onClick={validateAuth} className="w-full py-4 bg-sky-600 rounded-2xl font-black text-[10px] text-white">AUTENTICAR</button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="h-screen flex flex-col bg-[#010409]">
                    {/* Telemetry Header (Gates) */}
                    <header className="grid grid-cols-3 gap-1 p-2 border-b border-sky-900/20 bg-black/40 text-[7px] font-bold">
                        <div className="bg-slate-900/50 p-2 rounded flex justify-between border border-sky-900/10">
                            <span className="text-sky-800">CPU_CORE</span>
                            <span className="text-sky-400">{telemetry.cpu}%</span>
                        </div>
                        <div className="bg-slate-900/50 p-2 rounded flex justify-between border border-sky-900/10">
                            <span className="text-sky-800">TEMP_CORE</span>
                            <span className="text-orange-500">{telemetry.temp}°C</span>
                        </div>
                        <div className="bg-slate-900/50 p-2 rounded flex justify-between border border-sky-900/10">
                            <span className="text-sky-800">NET_DATA</span>
                            <span className="text-green-500">{telemetry.net}Mb/s</span>
                        </div>
                    </header>

                    {/* Navigation */}
                    <div className="flex justify-between items-center px-4 py-3 bg-slate-950/80">
                        <span className="text-[10px] font-black text-sky-500 tracking-tighter italic">KONRE ULTRA v2.7</span>
                        <div className="flex gap-1">
                            <button onClick={() => setView("chat")} className={`px-4 py-1.5 text-[8px] font-bold rounded-lg ${view === 'chat' ? 'bg-sky-600 text-white' : 'text-slate-600'}`}>CHAT</button>
                            <button onClick={() => setView("vault")} className={`px-4 py-1.5 text-[8px] font-bold rounded-lg ${view === 'vault' ? 'bg-sky-600 text-white' : 'text-slate-600'}`}>BÜNKER</button>
                        </div>
                    </div>

                    <main className="flex-1 overflow-hidden flex flex-col">
                        {view === 'chat' ? (
                            <>
                                <div className="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
                                    {messages.map(msg => (
                                        <div key={msg.id} className={`flex flex-col ${msg.type === 'user' ? 'items-end' : 'items-start'}`}>
                                            <div className={`p-4 rounded-2xl text-[11px] max-w-[85%] leading-relaxed ${
                                                msg.type === 'user' ? 'bg-sky-900/30 text-sky-100 border border-sky-800/30' : 'bg-slate-900 text-slate-200 border border-slate-800'
                                            }`}>
                                                {msg.text}
                                            </div>
                                        </div>
                                    ))}
                                    {isSearching && <div className="text-[8px] text-sky-600 font-bold animate-pulse px-4">BUSCANDO EN REDES DE INGENIERÍA...</div>}
                                    <div ref={chatEndRef} />
                                </div>
                                
                                <div className="p-4 bg-black/40 border-t border-sky-900/10 flex flex-col gap-3">
                                    <div className="flex gap-2">
                                        <button 
                                            onClick={toggleListening} 
                                            className={`p-4 rounded-2xl ${isListening ? 'bg-red-600 animate-pulse' : 'bg-slate-800 text-sky-500'}`}
                                        >
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v1a7 7 0 01-14 0v-1M12 18.5V23"/></svg>
                                        </button>
                                        <input 
                                            value={userInput} 
                                            onChange={(e) => setUserInput(e.target.value)}
                                            onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                            className="flex-1 bg-slate-900/50 border border-slate-800 rounded-2xl px-5 text-xs text-white focus:border-sky-700 focus:outline-none" 
                                            placeholder={isListening ? "Escuchando..." : "Consulta técnica..."} 
                                        />
                                        <button onClick={() => handleSend()} className="p-4 bg-sky-600 rounded-2xl text-white">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                                        </button>
                                    </div>
                                </div>
                            </>
                        ) : (
                            <div className="flex-1 overflow-y-auto p-6 space-y-4 custom-scrollbar">
                                <div className="flex justify-between items-center border-b border-sky-900/20 pb-4">
                                    <h3 className="text-[10px] font-black text-sky-500 uppercase">Hardware & Projects Vault</h3>
                                    <button onClick={() => {
                                        const t = prompt("IDENTIFICADOR:");
                                        const s = prompt("ESPECIFICACIONES:");
                                        if(t && s) setRecords([...records, {id: Date.now(), title: t, specs: s, date: new Date().toLocaleDateString()}]);
                                    }} className="bg-sky-600 px-4 py-2 rounded-xl text-[9px] font-bold text-white uppercase tracking-tighter">Registrar</button>
                                </div>
                                {records.map(r => (
                                    <div key={r.id} className="p-4 bg-slate-900 border border-slate-800 rounded-2xl relative">
                                        <div className="flex justify-between text-[7px] text-slate-600 mb-2 uppercase"><span>REG_{r.date}</span><button onClick={() => setRecords(records.filter(x => x.id !== r.id))}>X</button></div>
                                        <h4 className="text-[11px] font-bold text-sky-100 uppercase">{r.title}</h4>
                                        <p className="text-[9px] text-slate-500 mt-1 font-light">{r.specs}</p>
                                    </div>
                                ))}
                            </div>
                        )}
                    </main>

                    <footer className="p-2 bg-black border-t border-sky-900/10 text-[6px] text-sky-900 flex justify-between font-bold">
                        <span>AUDIO_OUTPUT: ENABLED</span>
                        <span>VOICE_RECOGNITION: READY</span>
                        <span>GROUNDING: GEMINI-2.5-FLASH</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
